name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Pytest
      run: |
        PYTHONPATH=src pytest app/tests/
        
    - name: Build Docker image
      if: success()
      run: |
        # Using a dummy model file for the docker build if not using DVC in CI
        touch model.pt
        docker build -t mlops-inference:latest .
        
    - name: Log in to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Push Docker image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker tag mlops-inference:latest ${{ secrets.DOCKERHUB_USERNAME }}/catdog:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/catdog:latest

    - name: Setup Minikube
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: medyagh/setup-minikube@latest
      
    - name: Deploy to Minikube
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        sed -i "s|image: kumarsankalp/catdog:latest|image: ${{ secrets.DOCKERHUB_USERNAME }}/catdog:latest|g" k8s/deployment.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl wait --for=condition=available --timeout=120s deployment/mlops-inference
        
    - name: Run Smoke Test
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        export SERVICE_IP=$(minikube ip)
        export SERVICE_PORT=$(kubectl get svc mlops-inference-service -o go-template='{{(index .spec.ports 0).nodePort}}')
        echo "Running smoke tests against http://$SERVICE_IP:$SERVICE_PORT"
        python smoke_test.py "http://$SERVICE_IP:$SERVICE_PORT"
