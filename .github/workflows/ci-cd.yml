name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Pytest
      run: |
        PYTHONPATH=src pytest app/tests/
        
    - name: Build Docker image
      if: success()
      run: |
        # Using a dummy model file for the docker build if not using DVC in CI
        touch model.pt
        docker build -t mlops-inference:latest .
        
    - name: Log in to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Push Docker image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        # Replace 'yourdockerhub' with actual Docker Hub username
        docker tag mlops-inference:latest ${{ secrets.DOCKER_USERNAME }}/mlops-inference:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/mlops-inference:latest
